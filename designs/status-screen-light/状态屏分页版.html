<header><h1>状态屏 · 分页与轮播</h1><p>ESP32 固件 0.5.0 · 400 × 300 横屏</p></header>
<section class="layout"><div class="viewer"><figure data-screen-label="浅色状态屏"><div class="screen" id="screen"><img id="preview" alt="三会话浅色状态屏：仓库与标题合并，状态、工具和耗时集中显示，提问与回复自动换行" width="400" height="300"></div><figcaption>示例内容 · 使用真实固件渲染和设备字体</figcaption></figure></div>
<aside><p class="aside-label">查看不同状态</p><div class="modes" aria-label="预览场景">
<button type="button" data-mode="cards" aria-pressed="true">第一页</button><button type="button" data-mode="two" aria-pressed="false">第二页</button><button type="button" data-mode="expanded" aria-pressed="false">单会话</button><button type="button" data-mode="offline" aria-pressed="false">离线</button><button type="button" data-mode="muted" aria-pressed="false">静音</button><button type="button" data-mode="empty" aria-pressed="false">待机</button><button type="button" data-mode="paused" aria-pressed="false">暂停轮播</button><button type="button" data-mode="alert" aria-pressed="false">新提醒</button></div>
<p class="detail" id="detail" aria-live="polite">每 20 秒自动翻页，后面的会话也能看见。短按 BOOT 手动翻页后停留 60 秒，留出阅读时间。</p>
<p class="note">按住 BOOT 约 1 秒松开，可暂停或恢复轮播。新授权或回答提醒会跳到对应页，确认前暂停轮播。</p>
<div class="size" aria-label="预览尺寸"><button type="button" data-size="400" aria-pressed="false">原始尺寸</button><button type="button" data-size="600" aria-pressed="true">放大查看</button></div></aside></section>
<footer><span>BOOT：短按翻页或确认 · 按住约 1 秒暂停轮播 · 长按 2 秒静音</span><span>这里只切换预览，不修改设备状态。实屏对比度以设备为准。</span></footer>

const descriptions={"cards": "每 20 秒自动翻页，后面的会话也能看见。短按 BOOT 手动翻页后停留 60 秒，留出阅读时间。", "two": "第二页显示剩余会话；只有一两个会话时会自动展开。右下角显示当前页码和阅读停留状态。", "expanded": "会话总数只有一个时无需翻页，整屏用于显示较长的提问与回复。", "offline": "断线时保留当前页，标明离线，不继续自动翻页。", "muted": "声音开关与翻页独立：长按约 2 秒仍切换静音。", "empty": "没有会话时保留时钟与等待界面。", "legacy": "没有对话内容的来源，使用四张紧凑状态卡片分页。", "paused": "按住 BOOT 约 1 秒松开，暂停轮播；仍可短按手动翻页，再按住 1 秒恢复轮播。", "alert": "新授权或回答提醒会跳到对应页，确认前不自动翻走。短按优先确认提醒，再短按才翻页。"};
const image=document.querySelector("#preview");image.src=images.cards;
document.querySelectorAll("[data-mode]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));image.src=images[button.dataset.mode];image.alt=button.textContent+"浅色固件预览";document.querySelector("#detail").textContent=descriptions[button.dataset.mode]}));
document.querySelectorAll("[data-size]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-size]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));document.querySelector("#screen").style.width=button.dataset.size+"px"}));
</script></body></html>
