<header><h1>状态屏 · 浅色阅读版</h1><p>ESP32 固件 0.4.0 · 400 × 300 横屏</p></header>
<section class="layout"><div class="viewer"><figure data-screen-label="浅色状态屏"><div class="screen" id="screen"><img id="preview" alt="三会话浅色状态屏：仓库与标题合并，状态、工具和耗时集中显示，提问与回复自动换行" width="400" height="300"></div><figcaption>示例内容 · 使用真实固件渲染和设备字体</figcaption></figure></div>
<aside><p class="aside-label">查看不同状态</p><div class="modes" aria-label="预览场景">
<button type="button" data-mode="cards" aria-pressed="true">三会话</button><button type="button" data-mode="two" aria-pressed="false">双会话</button><button type="button" data-mode="expanded" aria-pressed="false">单会话</button><button type="button" data-mode="offline" aria-pressed="false">离线</button><button type="button" data-mode="muted" aria-pressed="false">静音</button><button type="button" data-mode="empty" aria-pressed="false">待机</button><button type="button" data-mode="legacy" aria-pressed="false">纯状态</button></div>
<p class="detail" id="detail" aria-live="polite">三个会话同屏，每个会话显示四行可换行的对话。授权提醒使用细边框，保留浅色背景。</p>
<p class="note">仓库与标题合为一行。状态、工具和耗时放在一起，下方留给提问与回复。会话越少，对话区域越大。</p>

const descriptions={cards:"三个会话同屏，每个会话显示四行可换行的对话。授权提醒使用细边框，保留浅色背景。",two:"两个会话平分可用高度，提问与回复获得更多行数，不需要滚动。",expanded:"只有一个会话时充分利用整屏，显示更长的最近提问和回复片段。",offline:"断线时保留上次内容，顶部和底部明确显示连接状态，避免把旧内容误认为实时进度。",muted:"静音状态直接显示在右上角，按键操作继续沿用现有习惯。",empty:"没有会话时显示时间和日期，等待新的编程任务。",legacy:"没有对话内容的来源，仍兼容四张紧凑状态卡片。"};
const image=document.querySelector("#preview");image.src=images.cards;
document.querySelectorAll("[data-mode]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));image.src=images[button.dataset.mode];image.alt=button.textContent+"浅色固件预览";document.querySelector("#detail").textContent=descriptions[button.dataset.mode]}));
document.querySelectorAll("[data-size]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-size]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));document.querySelector("#screen").style.width=button.dataset.size+"px"}));
</script></body></html>
