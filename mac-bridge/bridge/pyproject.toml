[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-display"
version = "0.1.0"
description = "Local AI coding session bridge for an ESP32 status display"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.11,<4"]

[project.scripts]
agent-display = "bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bridge*"]
